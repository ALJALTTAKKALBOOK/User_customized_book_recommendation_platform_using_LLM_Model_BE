version: '3.8'

services:
  # 서비스 이름 (컨테이너 간 통신 때 쓰이는 Domain Name : 실제 도커 임베디드 dns 서버에 저장되는 이름)
  # 1. 데이터베이스 서비스 (3,925권의 도서 및 벡터 데이터가 전 자동 초기화되는 전용 이미지 빌드)
  bookagent-db:
    build: ./db #  중요: db/Dockerfile을 실행하여 나만의 맞춤형 이미지를 빌드
    container_name: bookfit_postgres
    restart: always # 나중에 .env 파일의 DATABASE_URL과 이 정보들이 정확히 일치해야 함
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123!
      POSTGRES_DB: bookfit
      TZ: Asia/Seoul
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432" # 외부 통신용 포트 (필요에 따라 DBeaver 접속용으로 유지)
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. 백엔드 서비스 (FastAPI 애플리케이션 이미지화 및 구동)
  backend:
    build: . # ./Dockerfile을 실행하여 내 앱을 자동으로 이미지화! [1.1.2, 1.1.3]
    container_name: bookfit_backend
    restart: always
    env_file: .env # .env 파일에 정의된 변수들을 주입
    depends_on:
      - bookagent-db # DB 컨테이너가 먼저 구동된 뒤 기동됨 [1.1.3]

  # 3. 프록시 서비스 (Nginx 보안 및 리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: bookfit_nginx
    restart: always
    ports:
      - "80:80" # 외부 일반 HTTP 포트 오픈
      - "443:443" # 외부 보안 HTTPS 포트 오픈
    volumes:
      # host directory / 마인드 마운트할 nginx container directory / ro = read only
      - ./nginx/conf.d:/etc/nginx/conf.d:ro # Nginx 설정 파일 주입 (바인드 마운트) [1.1.5, 1.2.6]
      - ./certbot/www:/var/www/certbot:ro # Certbot 검증용 가상 볼륨 마운트 [1.1.5, 1.1.9]
      - ./certbot/conf:/etc/letsencrypt:ro # 실제 HTTPS 인증서 공유용 볼륨 마운트 [1.1.5, 1.1.9]
    depends_on:
      - backend # 백엔드 컨테이너가 완전히 구동된 뒤 기동됨 [1.1.3]

# 데이터베이스 영속화를 위한 도커 전용 볼륨 공간 정의 [1.1.5, 2.2.1]
volumes:
  pgdata:
